<!DOCTYPE html>
<html>
<head><title>Dummy AUT</title></head>
<body>
    <h1>Welcome to QA environment</h1>
    <button id="clickMe">Click me</button>
    <div id="message"></div>
    <script>
        document.getElementById('clickMe').onclick = function() {
            document.getElementById('message').innerHTML = 'Button clicked!';
        };
    </script>
</body>
</html>
