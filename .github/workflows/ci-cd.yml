name: CI/CD to GKE with Selenium Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}
  IMAGE_NAME: ${{ secrets.ARTIFACT_REGISTRY }}/dummy-aut:${{ github.sha }}
  TEST_REPO: sourav344/selenium-tests   # change to your username
  TEST_BRANCH: main

jobs:
  build-and-deploy-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & push Docker image
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ secrets.ARTIFACT_REGISTRY }}
      - name: Build & push
        run: |
          docker build -t ${{ env.IMAGE_NAME }} .
          docker push ${{ env.IMAGE_NAME }}
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          credentials: ${{ secrets.GKE_SA_KEY }}
      - name: Deploy to QA
        run: |
          sed -i "s|IMAGE_NAME_PLACEHOLDER|${{ env.IMAGE_NAME }}|g" k8s/qa/deployment.yaml
          kubectl apply -f k8s/qa/
          kubectl rollout status deployment/dummy-aut -n qa --timeout=300s
      - name: Get QA service IP
        id: qa-ip
        run: |
          IP=""
          while [ -z "$IP" ]; do
            IP=$(kubectl get svc dummy-aut-svc -n qa -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            [ -z "$IP" ] && sleep 10
          done
          echo "qa_ip=$IP" >> $GITHUB_OUTPUT

  run-tests:
    runs-on: ubuntu-latest
    needs: build-and-deploy-qa
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TEST_REPO }}
          ref: ${{ env.TEST_BRANCH }}
          path: selenium-tests
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('selenium-tests/pom.xml') }}
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Wait for QA
        run: |
          IP="${{ needs.build-and-deploy-qa.outputs.qa_ip }}"
          until curl -s "http://$IP" > /dev/null; do sleep 5; done
          echo "QA_URL=http://$IP" >> $GITHUB_ENV
      - name: Run tests
        run: |
          cd selenium-tests
          mvn clean test -Dtest.base.url="${{ needs.build-and-deploy-qa.outputs.qa_ip }}"
        env:
          CHROME_OPTIONS: "--headless --no-sandbox --disable-dev-shm-usage"
      - name: Store test result
        id: test
        run: echo "status=passed" >> $GITHUB_OUTPUT

  promote-to-prod:
    runs-on: ubuntu-latest
    needs: run-tests
    if: success()
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          credentials: ${{ secrets.GKE_SA_KEY }}
      - name: Deploy to PROD
        run: |
          sed -i "s|IMAGE_NAME_PLACEHOLDER|${{ env.IMAGE_NAME }}|g" k8s/prod/deployment.yaml
          kubectl apply -f k8s/prod/
          kubectl rollout status deployment/dummy-aut -n prod --timeout=300s
