name: CI/CD to GKE (Hardcoded Test URL)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}
  IMAGE_NAME: ${{ secrets.ARTIFACT_REGISTRY }}/dummy-aut:${{ github.sha }}
  TEST_REPO: sourav344/selenium-tests   # Change to your test repo
  TEST_BRANCH: main

jobs:
  build-and-deploy-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AUT code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-docker.pkg.dev

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }} .

      - name: Push Docker image
        run: docker push ${{ env.IMAGE_NAME }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          credentials: ${{ secrets.GKE_SA_KEY }}

      - name: Deploy to QA namespace
        run: |
          sed -i "s|IMAGE_NAME_PLACEHOLDER|${{ env.IMAGE_NAME }}|g" k8s/qa/deployment.yaml
          kubectl apply -f k8s/qa/
          kubectl rollout status deployment/dummy-aut -n qa --timeout=300s

  run-tests:
    runs-on: ubuntu-latest
    needs: build-and-deploy-qa
    steps:
      - name: Checkout test framework repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TEST_REPO }}
          ref: ${{ env.TEST_BRANCH }}
          path: selenium-tests

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('selenium-tests/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install Chrome and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupf xvfb
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Run Selenium Cucumber tests
        run: |
          cd selenium-tests
          xvfb-run mvn clean test
        env:
          CHROME_OPTIONS: "--headless --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=1920,1080"

  promote-to-prod:
    runs-on: ubuntu-latest
    needs: run-tests
    if: success()
    steps:
      - name: Checkout AUT repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          credentials: ${{ secrets.GKE_SA_KEY }}

      - name: Deploy to PROD namespace
        run: |
          sed -i "s|IMAGE_NAME_PLACEHOLDER|${{ env.IMAGE_NAME }}|g" k8s/prod/deployment.yaml
          kubectl apply -f k8s/prod/
          kubectl rollout status deployment/dummy-aut -n prod --timeout=300s

      - name: Notify success
        run: echo "✅ Promotion to PROD completed (tests passed against hardcoded URL)"