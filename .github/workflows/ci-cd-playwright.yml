name: CI/CD to GKE with Playwright-Java Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}
  IMAGE_NAME: ${{ secrets.ARTIFACT_REGISTRY }}/dummy-aut:${{ github.sha }}
  TEST_REPO: sourav344/playwright-tests
  TEST_BRANCH: main
  # Secret Manager secret name where the service account JSON is stored
  GKE_SA_KEY_SECRET_NAME: github-actions-sa-key   # Change if needed

jobs:
  build-and-deploy-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AUT code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}   # Temporarily still needed for initial auth
          # We will replace this after fetching from Secret Manager

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      # --- NEW: Fetch SA key from GCP Secret Manager ---
      - name: Fetch GKE SA key from Secret Manager
        id: fetch-sa-key
        run: |
          # The previous auth (using GKE_SA_KEY secret) gives us access to Secret Manager
          gcloud secrets versions access latest --secret="${{ env.GKE_SA_KEY_SECRET_NAME }}" > /tmp/gke-sa-key.json
          echo "SA_KEY_PATH=/tmp/gke-sa-key.json" >> $GITHUB_OUTPUT

      # Re‑authenticate using the key from Secret Manager (so we don't rely on GitHub secret)
      - name: Authenticate again with SA key from Secret Manager
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ steps.fetch-sa-key.outputs.SA_KEY_PATH }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-docker.pkg.dev

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }} .

      - name: Push Docker image
        run: docker push ${{ env.IMAGE_NAME }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          credentials: ${{ steps.fetch-sa-key.outputs.SA_KEY_PATH }}

      - name: Deploy to QA namespace
        run: |
          sed -i "s|IMAGE_NAME_PLACEHOLDER|${{ env.IMAGE_NAME }}|g" k8s/qa/deployment.yaml
          kubectl apply -f k8s/qa/
          kubectl rollout status deployment/dummy-aut -n qa --timeout=300s

  run-tests:
    runs-on: ubuntu-latest
    needs: build-and-deploy-qa
    steps:
      - name: Checkout test framework
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TEST_REPO }}
          ref: ${{ env.TEST_BRANCH }}
          path: playwright-tests

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('playwright-tests/pom.xml') }}

      - name: Install Playwright dependencies (system libraries)
        run: |
          sudo apt-get update
          # Install Playwright's required system dependencies (without npx)
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm-dev libxkbcommon-dev \
            libgbm-dev libasound-dev libatspi2.0-0 libxshmfence-dev
          # Install Playwright browsers
          cd playwright-tests
          mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install"

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: playwright-tests
          args: >
            -Dsonar.organization=sourav344
            -Dsonar.projectKey=sourav344_playwright-tests

      - name: Run Playwright Java tests (headless)
        run: |
          cd playwright-tests
          mvn clean test -Dheadless=true

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-reports
          path: playwright-tests/target/cucumber-reports/

  promote-to-prod:
    runs-on: ubuntu-latest
    needs: run-tests
    if: success()
    steps:
      - name: Checkout AUT code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}   # Still need initial auth; ideally also fetch from SM
          # For consistency, you could also fetch the SA key again, but we keep as is for simplicity

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          credentials: ${{ secrets.GKE_SA_KEY }}

      - name: Deploy to PROD
        run: |
          sed -i "s|IMAGE_NAME_PLACEHOLDER|${{ env.IMAGE_NAME }}|g" k8s/prod/deployment.yaml
          kubectl apply -f k8s/prod/
          kubectl rollout status deployment/dummy-aut -n prod --timeout=300s

      - name: Notify success
        run: echo "✅ Promotion to PROD completed (Playwright tests passed)"